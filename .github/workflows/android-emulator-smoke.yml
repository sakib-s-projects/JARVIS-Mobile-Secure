name: JARVIS Continuous Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, h1-main-port, h2-chatgpt-signin-hardening ]

permissions:
  contents: read

concurrency:
  group: jarvis-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: "${{ matrix.module }} — unit tests, lint and debug build"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        module: [app, local]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon :${{ matrix.module }}:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew --no-daemon :${{ matrix.module }}:lintDebug

      - name: Compile debug variant
        run: ./gradlew --no-daemon :${{ matrix.module }}:assembleDebug

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-${{ matrix.module }}-quality-reports
          path: |
            ${{ matrix.module }}/build/reports/tests/
            ${{ matrix.module }}/build/test-results/
            ${{ matrix.module }}/build/reports/lint-results-*.html
            ${{ matrix.module }}/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  relay-security-tests:
    name: Relay prompt-context security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install relay dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run relay security tests
        run: python -m unittest discover -s server -p 'test_*.py'

  android-10-emulator:
    name: Android 10 (API 29) end-to-end instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-lint-build, relay-security-tests]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 10 emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Upload Android emulator reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-android-10-emulator-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
