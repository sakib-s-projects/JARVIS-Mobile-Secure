name: Verify H1-H2-H3 Integration

on:
  push:
    branches: [h1-h2-h3-integration]
  pull_request:
    branches: [h2-chatgpt-signin-hardening]

permissions:
  contents: read

concurrency:
  group: jarvis-h123-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check cloudflare/relay-adapter/src/index.js
      - run: node --test cloudflare/relay-adapter/src/index.test.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: FastAPI relay tests
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q
      - run: docker build --tag jarvis-relay-ci:security-check server
      - run: ./gradlew --no-daemon testDebugUnitTest
      - run: ./gradlew --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: JARVIS-H1-H2-H3-integration-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
